<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Ardell Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

  <!-- Header Admin -->
  <header class="bg-slate-800 text-white p-4 shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">Panel Admin Ardell Shop</h1>
      <a href="index.html" target="_blank" class="text-xs bg-pink-600 hover:bg-pink-700 text-white px-3 py-1.5 rounded-lg transition">
        Lihat Web Utama ↗
      </a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 grid grid-cols-1 md:grid-cols-3 gap-6 mt-4">

    <!-- Form Tambah Produk -->
    <section class="bg-white p-5 rounded-lg shadow-sm border border-gray-200 md:col-span-1">
      <h2 class="text-lg font-bold mb-4 text-gray-900 border-b pb-2">Tambah Produk Baru</h2>

      <form id="form-produk" class="flex flex-col gap-3">
        <!-- Nama Produk -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Nama Produk *</label>
          <input type="text" id="nama" placeholder="Contoh: Bra Seamless Katun" required class="w-full border rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500">
        </div>

        <!-- Dropdown Kategori (Mudah & Mencegah Typo) -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Kategori Produk *</label>
          <select id="kategori" required class="w-full border rounded p-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-pink-500">
            <option value="BRA">BRA</option>
            <option value="CD">CD (Celana Dalam)</option>
            <option value="KORSET">KORSET</option>
          </select>
        </div>

        <!-- Harga -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Harga (Rp) *</label>
          <input type="number" id="harga" placeholder="Contoh: 45000" required class="w-full border rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500">
        </div>

        <!-- Deskripsi -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Deskripsi Singkat</label>
          <textarea id="deskripsi" rows="2" placeholder="Contoh: Bahan adem, tanpa kawat" class="w-full border rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500"></textarea>
        </div>

        <!-- URL Gambar -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Link Gambar (URL) *</label>
          <input type="url" id="gambarUrl" placeholder="https://..." required class="w-full border rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500">
        </div>

        <!-- URL Shopee -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Link Shopee (Opsional)</label>
          <input type="url" id="shopeeUrl" placeholder="https://shopee.co.id/..." class="w-full border rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500">
        </div>

        <!-- Tombol Submit -->
        <button type="submit" id="btn-simpan" class="bg-pink-600 hover:bg-pink-700 text-white font-bold py-2 px-4 rounded-lg text-sm mt-2 transition">
          + Simpan Produk
        </button>
      </form>
    </section>

    <!-- Daftar Produk yang Sudah Ada -->
    <section class="bg-white p-5 rounded-lg shadow-sm border border-gray-200 md:col-span-2">
      <h2 class="text-lg font-bold mb-4 text-gray-900 border-b pb-2">Daftar Produk Aktif</h2>
      <div id="daftar-admin" class="flex flex-col gap-3">
        <p class="text-gray-400 text-sm italic">Memuat daftar produk...</p>
      </div>
    </section>

  </main>

  //script pasword admin

<script>

const PASSWORD_ADMIN = "Elly1978"; 

const passInput = prompt("Masukkan Password:");

if (passInput !== PASSWORD_ADMIN) {
  alert("Password salah! Anda tidak memiliki akses.");
  window.location.href = "index.html"; // Lempar balik ke halaman depan
}
</script>

<!-- Script Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyArnm0DSkxrWCWU_nvdwy8slXAuEiAVYOs",
      authDomain: "ardell-shop.firebaseapp.com",
      projectId: "ardell-shop",
      storageBucket: "ardell-shop.firebasestorage.app",
      messagingSenderId: "677223588317",
      appId: "1:677223588317:web:5289558b6afc3a63075634"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById("form-produk");
    const daftarAdminEl = document.getElementById("daftar-admin");

    // 1. Fungsi Tambah Produk ke Firebase
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btnSimpan = document.getElementById("btn-simpan");
      btnSimpan.innerText = "Lagi Menyimpan...";
      btnSimpan.disabled = true;

      const produkBaru = {
        nama: document.getElementById("nama").value,
        kategori: document.getElementById("kategori").value,
        harga: Number(document.getElementById("harga").value),
        deskripsi: document.getElementById("deskripsi").value,
        gambarUrl: document.getElementById("gambarUrl").value,
        shopeeUrl: document.getElementById("shopeeUrl").value,
        createdAt: new Date()
      };

      try {
        await addDoc(collection(db, "produk"), produkBaru);
        alert("Berhasil menambah produk!");
        form.reset();
        muatProdukAdmin();
      } catch (error) {
        console.error("Gagal simpan:", error);
        alert("Gagal menyimpan produk.");
      } finally {
        btnSimpan.innerText = "+ Simpan Produk";
        btnSimpan.disabled = false;
      }
    });

    // 2. Fungsi Ambil & Tampilkan Produk di Admin
    async function muatProdukAdmin() {
      daftarAdminEl.innerHTML = `<p class="text-gray-400 text-sm italic">Memuat data...</p>`;
      try {
        const querySnapshot = await getDocs(collection(db, "produk"));
        daftarAdminEl.innerHTML = "";

        if (querySnapshot.empty) {
          daftarAdminEl.innerHTML = `<p class="text-gray-400 text-sm italic">Belum ada produk tersimpan.</p>`;
          return;
        }

        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const hargaFormatted = Number(data.harga || 0).toLocaleString("id-ID");

          const itemHtml = `
            <div class="flex items-center justify-between border p-3 rounded-lg bg-gray-50">
              <div class="flex items-center gap-3">
                <img src="${data.gambarUrl}" class="w-12 h-12 object-cover rounded border bg-white" alt="thumb">
                <div>
                  <h4 class="font-bold text-sm text-gray-900">${data.nama}</h4>
                  <p class="text-xs text-gray-500">
                    <span class="bg-pink-100 text-pink-700 px-1.5 py-0.5 rounded font-semibold text-[10px]">${data.kategori}</span>
                    • Rp ${hargaFormatted}
                  </p>
                </div>
              </div>
              <button onclick="hapusProduk('${docSnap.id}')" class="bg-red-500 hover:bg-red-600 text-white text-xs px-3 py-1.5 rounded transition font-medium">
                Hapus
              </button>
            </div>
          `;
          daftarAdminEl.innerHTML += itemHtml;
        });

      } catch (error) {
        console.error("Gagal muat data admin:", error);
        daftarAdminEl.innerHTML = `<p class="text-red-500 text-sm">Gagal memuat produk.</p>`;
      }
    }

    // 3. Fungsi Hapus Produk
    window.hapusProduk = async function(id) {
      if (confirm("Yakin ingin menghapus produk ini?")) {
        try {
          await deleteDoc(doc(db, "produk", id));
          alert("Produk berhasil dihapus!");
          muatProdukAdmin();
        } catch (error) {
          console.error("Gagal hapus:", error);
          alert("Gagal menghapus produk.");
        }
      }
    };

    // Jalankan saat halaman dibuka
    muatProdukAdmin();
  </script>
</body>
</html>
